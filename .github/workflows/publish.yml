name: Publish Package

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          # This job holds the OIDC publish token, so install from the registry, not from a cache other runs can write to.
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # No NPM_TOKEN: pnpm exchanges the GitHub OIDC token for a short-lived
      # credential (trusted publishing) and attaches a provenance attestation.
      # --no-git-checks: the tag push checks out a detached HEAD, which pnpm's
      # default branch/clean-tree checks would otherwise reject.
      - name: Publish
        run: pnpm publish --provenance --access public --no-git-checks
