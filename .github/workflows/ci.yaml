name: CI

on:
  push:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # The integration tests send real mail over SMTP and read it back through the maildev API.
    services:
      maildev:
        image: maildev/maildev:2.2.1
        ports:
          - 1025:1025
          - 1080:1080

    env:
      MAILDEV_SMTP_ENDPOINT: localhost
      MAILDEV_SMTP_PORT: 1025
      MAILDEV_API_ENDPOINT: http://localhost:1080

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
